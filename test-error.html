<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>错误处理演示 - 校园生活服务数据中心</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container">
      <a class="navbar-brand" href="index.html">
        <i class="bi bi-mortarboard-fill"></i>校园生活服务数据中心
      </a>
      <div class="collapse navbar-collapse show">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">首页</a></li>
          <li class="nav-item"><a class="nav-link" href="pages/cafeteria.html">食堂数据</a></li>
          <li class="nav-item"><a class="nav-link" href="pages/studyroom.html">自习室管理</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <h2 class="section-title"><i class="bi bi-exclamation-triangle"></i> 错误处理演示</h2>
    <p class="text-muted">本页面用于演示三种错误情况的处理效果，点击按钮触发对应场景。</p>
    <div class="row g-3">
      <div class="col-md-4">
        <div class="stat-card">
          <h5>网络失败</h5>
          <p class="text-muted small">加载不存在的 JSON 文件，触发请求失败提示。</p>
          <button class="btn btn-outline-danger" id="btn-network">触发网络失败</button>
        </div>
      </div>
      <div class="col-md-4">
        <div class="stat-card">
          <h5>数据为空</h5>
          <p class="text-muted small">见"食堂数据"页搜索不存在的关键词，表格显示空状态提示。</p>
          <a class="btn btn-outline-warning" href="pages/cafeteria.html">前往演示</a>
        </div>
      </div>
      <div class="col-md-4">
        <div class="stat-card">
          <h5>非法输入</h5>
          <p class="text-muted small">见"自习室管理"页提交空表单或非法数值，弹出校验错误提示。</p>
          <a class="btn btn-outline-primary" href="pages/studyroom.html">前往演示</a>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="js/common.js"></script>
  <script>
    $('#btn-network').on('click', function () {
      loadJSON('data/not-exist.json');
    });
    // 页面加载 1 秒后自动触发一次网络失败演示
    setTimeout(function () { loadJSON('data/not-exist.json'); }, 1000);
  </script>
</body>
</html>
