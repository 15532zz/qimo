<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>自习室管理 - 校园生活服务数据中心</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="../css/style.css" rel="stylesheet" />
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container">
      <a class="navbar-brand" href="../index.html">
        <i class="bi bi-mortarboard-fill"></i>校园生活服务数据中心
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="../index.html"><i class="bi bi-house"></i> 首页</a></li>
          <li class="nav-item"><a class="nav-link" href="cafeteria.html"><i class="bi bi-egg-fried"></i> 食堂数据</a></li>
          <li class="nav-item"><a class="nav-link active" href="studyroom.html"><i class="bi bi-book"></i> 自习室管理</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <header class="page-header">
    <div class="container">
      <h1><i class="bi bi-book"></i> 自习室管理</h1>
      <p>查询座位使用情况，支持添加、修改自习室信息</p>
    </div>
  </header>

  <main class="container pb-5">

    <!-- 概览统计 -->
    <div class="row g-3 mb-4">
      <div class="col-6 col-md-3">
        <div class="stat-card">
          <div class="stat-icon" style="background:linear-gradient(135deg,#34d399,#059669)"><i class="bi bi-house-door"></i></div>
          <div class="stat-value" id="stat-rooms">-</div>
          <div class="stat-label">自习室总数</div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="stat-card">
          <div class="stat-icon" style="background:linear-gradient(135deg,#60a5fa,#2563eb)"><i class="bi bi-chair"></i></div>
          <div class="stat-value" id="stat-capacity">-</div>
          <div class="stat-label">总座位数</div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="stat-card">
          <div class="stat-icon" style="background:linear-gradient(135deg,#fbbf24,#d97706)"><i class="bi bi-person-check"></i></div>
          <div class="stat-value" id="stat-available">-</div>
          <div class="stat-label">可用座位</div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="stat-card">
          <div class="stat-icon" style="background:linear-gradient(135deg,#f472b6,#db2777)"><i class="bi bi-percent"></i></div>
          <div class="stat-value" id="stat-rate">-</div>
          <div class="stat-label">平均使用率</div>
        </div>
      </div>
    </div>

    <!-- 操作栏 -->
    <div class="filter-bar">
      <div class="row g-2 align-items-center">
        <div class="col-md-4">
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-search"></i></span>
            <input type="text" id="search-input" class="form-control" placeholder="搜索自习室名称或位置..." />
          </div>
        </div>
        <div class="col-md-3">
          <select id="filter-available" class="form-select">
            <option value="">全部状态</option>
            <option value="available">有座位</option>
            <option value="full">已满</option>
          </select>
        </div>
        <div class="col-md-5 text-md-end">
          <button id="btn-add" class="btn btn-primary">
            <i class="bi bi-plus-lg"></i> 添加自习室
          </button>
        </div>
      </div>
    </div>

    <!-- 自习室表格 -->
    <div class="table-responsive">
      <table class="table table-hover align-middle">
        <thead class="table-light">
          <tr>
            <th>名称</th>
            <th>位置</th>
            <th>容量</th>
            <th>可用</th>
            <th>状态</th>
            <th>开放时间</th>
            <th>设施</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="room-tbody">
        </tbody>
      </table>
      <div id="room-empty" class="text-center text-muted py-4" style="display:none;">
        <i class="bi bi-inbox fs-1 d-block mb-2"></i>暂无符合条件的自习室
      </div>
    </div>

    <!-- 图表区 -->
    <div class="row g-3 mt-4">
      <div class="col-lg-8">
        <div class="chart-card">
          <h5><i class="bi bi-graph-up"></i> 一周自习室使用率趋势</h5>
          <div id="chart-trend" class="chart-container"></div>
        </div>
      </div>
      <div class="col-lg-4">
        <div class="chart-card">
          <h5><i class="bi bi-bar-chart"></i> 各楼栋座位分布</h5>
          <div id="chart-building" class="chart-container"></div>
        </div>
      </div>
    </div>

  </main>

  <!-- 添加/编辑 模态框 -->
  <div class="modal fade" id="room-modal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header bg-primary text-white">
          <h5 class="modal-title" id="modal-title"><i class="bi bi-plus-lg"></i> 添加自习室</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="room-form">
            <input type="hidden" id="room-id" />
            <div class="mb-3">
              <label class="form-label">名称 <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="room-name" required />
            </div>
            <div class="mb-3">
              <label class="form-label">位置 <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="room-location" required />
            </div>
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">容量 <span class="text-danger">*</span></label>
                <input type="number" class="form-control" id="room-capacity" min="1" required />
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">可用座位 <span class="text-danger">*</span></label>
                <input type="number" class="form-control" id="room-available" min="0" required />
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label">开放时间</label>
              <input type="text" class="form-control" id="room-opentime" placeholder="例如 08:00-21:00" />
            </div>
            <div class="row">
              <div class="col-6">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="room-power" />
                  <label class="form-check-label" for="room-power">有电源</label>
                </div>
              </div>
              <div class="col-6">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="room-wifi" />
                  <label class="form-check-label" for="room-wifi">有 WiFi</label>
                </div>
              </div>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
          <button type="button" class="btn btn-primary" id="btn-save">保存</button>
        </div>
      </div>
    </div>
  </div>

  <footer class="bg-dark text-white-50 py-3 mt-5">
    <div class="container text-center small">
      校园生活服务数据中心 &copy; 2026
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>

  <script src="../js/common.js"></script>
  <script src="studyroom.js"></script>
</body>
</html>
